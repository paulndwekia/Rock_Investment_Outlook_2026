<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17212A">
  <title>Offline · Kenya Investment Intelligence</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#F5F4F0;color:#17212A;font-family:Arial,Helvetica,sans-serif}
    main{width:min(100%,440px);padding:32px;border:1px solid #E7E3DA;border-radius:20px;background:#fff;text-align:center}
    .mark{width:64px;height:64px;margin:0 auto 22px;display:grid;place-items:center;border-radius:16px;background:#17212A;color:#E6CF9B;font-size:26px;font-weight:700}
    h1{font-size:23px;margin:0 0 12px}p{font-size:14px;line-height:1.7;color:#68726E;margin:0 0 24px}
    a{display:inline-block;padding:12px 18px;border-radius:9px;background:#17212A;color:#fff;text-decoration:none;font-size:13px;font-weight:600}
    small{display:block;margin-top:18px;color:#929791;font-size:11px;line-height:1.6}
  </style>
</head>
<body>
  <main>
    <div class="mark">K</div>
    <h1>You are offline</h1>
    <p>Kenya Investment Intelligence needs an internet connection to refresh market observations. Your saved app shell is available, but live data and charts are not cached.</p>
    <a href="/">Try again</a>
    <small>Market data is never replaced with invented values when the connection is unavailable.</small>
  </main>
</body>
</html>
