name: Project checks

on:
  push:
    branches:
      - main
      - feat/gold-react-dashboard
    paths:
      - "dashboard/**"
      - "ingestion_service/**"
      - "scripts/**"
      - "website/**"
      - "scripts/**"
      - "website/**"
      - ".github/workflows/project-checks.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - "ingestion_service/**"
      - ".github/workflows/project-checks.yml"

permissions:
  contents: read

jobs:
  dashboard-build:
    name: Build dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm install --no-audit --no-fund
      - name: Check dependency advisories
        working-directory: dashboard
        run: npm audit --audit-level=high
      - name: Test public data normalisation
        working-directory: dashboard
        run: npm run test:public-data
      - name: Build dashboard
        working-directory: dashboard
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  research-model-tests:
    name: Test quantitative research models
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research model dependencies
        run: python -m pip install -r scripts/requirements-test.txt
      - name: Run quantitative model regression tests
        run: python -m pytest scripts/tests -q
      - name: Compile research scripts and Streamlit app
        run: python -m compileall -q scripts website/app.py

  ingestion-service-syntax:
    name: Check ingestion service
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install service dependencies
        working-directory: ingestion_service
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python modules
        working-directory: ingestion_service
        run: python -m compileall -q .
      - name: Run importer unit tests
        working-directory: ingestion_service
        run: pytest -q
